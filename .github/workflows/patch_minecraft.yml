name: Patch Minecraft 1.21.111 ARM64
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the user-supplied Minecraft 1.21.111 ARM64 APK"
        required: true
        default: "mc-base"
      asset_name:
        description: "APK asset name"
        required: true
        default: "minecraft-1-21-111.apk"
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: ''
      - name: Install Android toolchain
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Install apktool
        run: |
          sudo curl -fsSL -o /usr/local/lib/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
      - name: Download Minecraft APK from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
        run: gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP"
      - name: Build native host and patch
        run: |
          chmod +x tools/*.sh
          mkdir -p out
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          tools/build-and-patch.sh "$RUNNER_TEMP/${{ inputs.asset_name }}" "$PWD/out/eclient-minecraft-1.21.111-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: eclient-minecraft-1.21.111-arm64
          path: out/eclient-minecraft-1.21.111-arm64.apk
