name: E-Client 1.21.111 ARM64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the original Minecraft APK"
        required: true
        default: "mc-base"

      asset_name:
        description: "Minecraft 1.21.111 APK asset name"
        required: true
        default: "minecraft-1-21-111.apk"

permissions:
  contents: read

concurrency:
  group: eclient-1.21.111-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build E-Client
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ==========================================================
      # SOURCE
      # ==========================================================

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show source tree
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 3 -type f | sort | head -300

          echo
          echo "Native source:"
          find native -type f | sort

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # ANDROID
      # ==========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Configure Android environment
        run: |
          set -e

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          set -e

          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"
          test -d "${ANDROID_SDK_ROOT}/cmake/3.22.1"

          echo
          adb version

          echo
          cmake --version

          echo
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

          echo
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --version

      # ==========================================================
      # SOURCE VALIDATION
      # ==========================================================

      - name: Validate source
        run: |
          set -e

          echo "Checking E-Client source..."

          test -f native/CMakeLists.txt
          test -f native/runtime/CMakeLists.txt

          test -f native/runtime/src/main.cpp

          test -f tools/build-and-patch.sh
          test -f tools/patch-minecraft-apk.sh
          test -f tools/verify-1.21.111.sh

          chmod +x tools/*.sh

          echo
          echo "Relevant source files:"
          find native/runtime -type f | sort

          echo
          echo "1.21.111 references:"
          grep -RniE \
            'SetSprinting|InitMaxAutoStep|Gravity|1\.21\.111|ea5614dcc3551721b14f9b4686aa1651c1b8f79e' \
            native/runtime 2>/dev/null || true

      # ==========================================================
      # DOWNLOAD ORIGINAL APK
      # ==========================================================

      - name: Download Minecraft APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/minecraft"

          gh release download \
            "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ inputs.asset_name }}" \
            --dir "$RUNNER_TEMP/minecraft"

          APK="$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}"

          test -f "$APK"

          echo
          echo "Downloaded:"
          ls -lh "$APK"

          echo
          echo "SHA-256:"
          sha256sum "$APK"

      # ==========================================================
      # VERIFY ORIGINAL APK
      # ==========================================================

      - name: Verify Minecraft 1.21.111
        run: |
          set -e

          chmod +x tools/verify-1.21.111.sh

          tools/verify-1.21.111.sh \
            "$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}"

      # ==========================================================
      # APKTOOL
      # ==========================================================

      - name: Install apktool
        run: |
          set -e

          curl -fsSL \
            -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

          sudo mkdir -p /usr/local/lib

          sudo mv \
            /tmp/apktool.jar \
            /usr/local/lib/apktool.jar

          cat <<'EOF' | sudo tee /usr/local/bin/apktool >/dev/null
          #!/bin/sh
          exec java -jar /usr/local/lib/apktool.jar "$@"
          EOF

          sudo chmod +x /usr/local/bin/apktool

          apktool --version

      # ==========================================================
      # CMAKE CONFIGURE
      # ==========================================================

      - name: Configure native build
        run: |
          set -e

          rm -rf build

          cmake \
            -S native \
            -B build/native-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build native runtime
        run: |
          set -e

          cmake \
            --build build/native-android \
            --parallel 2 \
            --verbose

      # ==========================================================
      # CHECK NATIVE OUTPUT
      # ==========================================================

      - name: Verify native output
        run: |
          set -e

          echo "Native libraries:"
          find build/native-android \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

          echo
          echo "ELF files:"

          find build/native-android \
            -type f \
            -name "*.so" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo
            echo "----- $file -----"
            file "$file"

            if ! file "$file" | grep -qiE \
              'ARM aarch64|ARM64'; then
              echo "ERROR: $file is not ARM64"
              exit 1
            fi
          done

      # ==========================================================
      # PATCH APK
      # ==========================================================

      - name: Build and patch APK
        run: |
          set -e

          mkdir -p out

          chmod +x tools/build-and-patch.sh
          chmod +x tools/patch-minecraft-apk.sh

          tools/build-and-patch.sh \
            "$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}" \
            "$PWD/out/eclient-minecraft-1.21.111-arm64.apk"

      # ==========================================================
      # VERIFY PATCHED APK
      # ==========================================================

      - name: Verify patched APK
        run: |
          set -e

          APK="out/eclient-minecraft-1.21.111-arm64.apk"

          test -f "$APK"

          echo "Patched APK:"
          ls -lh "$APK"

          echo
          echo "Patched APK SHA-256:"
          sha256sum "$APK"

          echo
          echo "ARM64 libraries inside APK:"
          unzip -l "$APK" | grep 'lib/arm64-v8a/' || true

          echo
          echo "Checking libminecraftpe.so..."

          unzip -l "$APK" | grep \
            'lib/arm64-v8a/libminecraftpe.so'

      # ==========================================================
      # APK SIGNATURE
      # ==========================================================

      - name: Verify APK signature
        run: |
          set -e

          apksigner verify \
            --verbose \
            "out/eclient-minecraft-1.21.111-arm64.apk"

      # ==========================================================
      # EXTRACT FINAL LIBRARIES
      # ==========================================================

      - name: Inspect final APK libraries
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/final"

          unzip -o \
            "out/eclient-minecraft-1.21.111-arm64.apk" \
            'lib/arm64-v8a/*' \
            -d "$RUNNER_TEMP/final"

          echo "Final ARM64 libraries:"

          find "$RUNNER_TEMP/final" \
            -type f \
            -print

          echo
          echo "ELF information:"

          find "$RUNNER_TEMP/final" \
            -type f \
            -name "*.so" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo
            echo "----- $file -----"
            file "$file"
          done

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: eclient-minecraft-1.21.111-arm64
          path: out/eclient-minecraft-1.21.111-arm64.apk
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # UPLOAD NATIVE BUILD
      # ==========================================================

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: eclient-native-1.21.111-arm64
          path: |
            build/native-android/**/*.so
            build/native-android/**/*.a
          if-no-files-found: warn
          retention-days: 14

      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Build summary
        if: always()
        run: |
          echo
          echo "=========================================="
          echo " E-CLIENT 1.21.111 BUILD"
          echo "=========================================="
          echo
          echo "ABI:      arm64-v8a"
          echo "NDK:      28.2.13676358"
          echo "CMake:    3.22.1"
          echo "Minecraft: 1.21.111"
          echo
          echo "Expected Minecraft SHA:"
          echo "69f6584c000a4ec80ff8c4790f43d80b3e2ee67788842fdd39fd5be70fdb3d59"
          echo
          echo "Expected GNU Build ID:"
          echo "ea5614dcc3551721b14f9b4686aa1651c1b8f79e"
          echo
          echo "=========================================="
