name: Patch Minecraft 1.21.111 ARM64
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the user-supplied Minecraft 1.21.111 ARM64 APK"
        required: true
        default: "mc-base"
      asset_name:
        description: "APK asset name (exact filename on the release)"
        required: true
        default: "minecraft-1-21-111.apk"
      release_repo:
        description: "Optional owner/repo if the release is not on this repository (leave empty for current repo)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: ''
      - name: Install Android toolchain
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Install apktool
        run: |
          sudo curl -fsSL -o /usr/local/lib/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
      - name: Download Minecraft APK from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
          RELEASE_REPO: ${{ inputs.release_repo }}
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_REPO}" ]]; then
            echo "Using release repo: ${RELEASE_REPO}"
          else
            echo "Using current repo: ${GITHUB_REPOSITORY}"
          fi

          echo "Looking up release tag: ${TAG}"

          # Never expand an empty array into gh — it becomes a 2nd positional arg
          # and triggers: accepts at most 1 arg(s), received 2
          if [[ -n "${RELEASE_REPO}" ]]; then
            gh release view --repo "\( {RELEASE_REPO}" " \){TAG}" --json tagName,name,isDraft,isPrerelease,assets
            mapfile -t ASSETS < <(gh release view --repo "\( {RELEASE_REPO}" " \){TAG}" --json assets --jq '.assets[].name')
          else
            gh release view "${TAG}" --json tagName,name,isDraft,isPrerelease,assets
            mapfile -t ASSETS < <(gh release view "${TAG}" --json assets --jq '.assets[].name')
          fi

          echo "Assets on release:"
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "::error::Release '${TAG}' has zero assets. Upload the APK to this release first."
            exit 1
          fi
          printf '  - %s\n' "${ASSETS[@]}"

          MATCH=""
          for name in "${ASSETS[@]}"; do
            if [[ "\( {name}" == " \){ASSET}" ]]; then
              MATCH="${name}"
              break
            fi
          done
          if [[ -z "${MATCH}" ]]; then
            echo "::error::No asset named exactly '\( {ASSET}' on release ' \){TAG}'."
            echo "Update the workflow input asset_name to one of the names listed above."
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}"
          if [[ -n "${RELEASE_REPO}" ]]; then
            gh release download --repo "\( {RELEASE_REPO}" " \){TAG}" --dir "\( {RUNNER_TEMP}" --clobber " \){MATCH}"
          else
            gh release download "\( {TAG}" --dir " \){RUNNER_TEMP}" --clobber "${MATCH}"
          fi

          APK_PATH="\( {RUNNER_TEMP}/ \){MATCH}"
          if [[ ! -f "${APK_PATH}" ]]; then
            echo "::error::Download finished but file missing: ${APK_PATH}"
            ls -la "${RUNNER_TEMP}" || true
            exit 1
          fi
          echo "Downloaded: \( {APK_PATH} ( \)(wc -c < "${APK_PATH}") bytes)"
          echo "SHA-256: \( (sha256sum " \){APK_PATH}" | awk '{print $1}')"
          echo "APK_PATH=\( {APK_PATH}" >> " \){GITHUB_ENV}"
      - name: Build native host and patch
        run: |
          set -euo pipefail
          chmod +x tools/*.sh
          mkdir -p out
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          if [[ -z "\( {APK_PATH:-}" || ! -f " \){APK_PATH}" ]]; then
            echo "::error::APK_PATH not set or file missing"
            exit 1
          fi
          tools/build-and-patch.sh "\( {APK_PATH}" " \){PWD}/out/eclient-minecraft-1.21.111-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: eclient-minecraft-1.21.111-arm64
          path: out/eclient-minecraft-1.21.111-arm64.apk
