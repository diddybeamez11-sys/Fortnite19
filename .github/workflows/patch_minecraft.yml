name: E-Client 1.21.111 ARM64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release containing Minecraft 1.21.111 APK"
        required: true
        default: "mc-base"
      asset_name:
        description: "Minecraft APK filename"
        required: true
        default: "minecraft-1-21-111.apk"

permissions:
  contents: read

concurrency:
  group: eclient-1.21.111-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==========================================================
      # SOURCE
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show source
        run: |
          set -e
          echo "Working directory:"
          pwd

          echo
          echo "Source:"
          find . -maxdepth 4 -type f | sort | head -400

      # ==========================================================
      # JAVA
      # ==========================================================

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # ANDROID SDK
      # ==========================================================

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Configure Android environment
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: |
          set -e

          test -d "$ANDROID_NDK_HOME"

          adb version
          cmake --version

          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

      # ==========================================================
      # DOWNLOAD MINECRAFT
      # ==========================================================

      - name: Download Minecraft 1.21.111
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/minecraft"

          gh release download \
            "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ inputs.asset_name }}" \
            --dir "$RUNNER_TEMP/minecraft"

          APK="$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}"

          test -f "$APK"

          echo "Minecraft APK:"
          ls -lh "$APK"

      # ==========================================================
      # VERIFY ORIGINAL APK
      #
      # IMPORTANT:
      # No GNU Build ID check.
      # The supplied binary has no readable GNU build-id note.
      # SHA-256 is the authoritative identity check.
      # ==========================================================

      - name: Verify Minecraft APK
        run: |
          set -e

          APK="$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}"

          EXPECTED_SHA="69f6584c000a4ec80ff8c4790f43d80b3e2ee67788842fdd39fd5be70fdb3d59"

          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"

          echo "Actual SHA:"
          echo "$ACTUAL_SHA"

          echo "Expected SHA:"
          echo "$EXPECTED_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Wrong Minecraft APK."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/minecraft-check"

          unzip -p \
            "$APK" \
            'lib/arm64-v8a/libminecraftpe.so' \
            > "$RUNNER_TEMP/minecraft-check/libminecraftpe.so"

          test -s "$RUNNER_TEMP/minecraft-check/libminecraftpe.so"

          echo
          echo "libminecraftpe.so:"
          file "$RUNNER_TEMP/minecraft-check/libminecraftpe.so"

          file "$RUNNER_TEMP/minecraft-check/libminecraftpe.so" \
            | grep -qiE 'ARM aarch64|ARM64'

          echo
          echo "Minecraft 1.21.111 input verified."

      # ==========================================================
      # VALIDATE SOURCE
      # ==========================================================

      - name: Validate source
        run: |
          set -e

          test -f native/CMakeLists.txt
          test -f native/runtime/CMakeLists.txt
          test -f native/runtime/src/main.cpp

          test -f tools/build-and-patch.sh

          chmod +x tools/*.sh

          echo
          echo "Native source:"
          find native -type f | sort

      # ==========================================================
      # CONFIGURE CMAKE
      # ==========================================================

      - name: Configure CMake
        run: |
          set -e

          rm -rf build

          cmake \
            -S native \
            -B build/native-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      # ==========================================================
      # BUILD NATIVE CODE
      # ==========================================================

      - name: Build native runtime
        run: |
          set -e

          cmake \
            --build build/native-android \
            --parallel 2 \
            --verbose

      # ==========================================================
      # VERIFY NATIVE OUTPUT
      # ==========================================================

      - name: Verify native libraries
        run: |
          set -e

          echo "Native libraries:"

          find build/native-android \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

          echo
          echo "Checking ARM64 libraries..."

          find build/native-android \
            -type f \
            -name "*.so" \
            -print0 |
          while IFS= read -r -d '' LIB; do

            echo
            echo "===== $LIB ====="

            file "$LIB"

            file "$LIB" | grep -qiE \
              'ARM aarch64|ARM64'

          done

      # ==========================================================
      # PATCH APK
      # ==========================================================

      - name: Patch Minecraft APK
        run: |
          set -e

          mkdir -p out

          chmod +x tools/build-and-patch.sh

          tools/build-and-patch.sh \
            "$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}" \
            "$PWD/out/eclient-minecraft-1.21.111-arm64.apk"

      # ==========================================================
      # VERIFY PATCHED APK
      # ==========================================================

      - name: Verify patched APK
        run: |
          set -e

          APK="out/eclient-minecraft-1.21.111-arm64.apk"

          test -f "$APK"

          echo "Patched APK:"
          ls -lh "$APK"

          echo
          echo "Patched SHA:"
          sha256sum "$APK"

          echo
          echo "ARM64 contents:"

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/'

          unzip -l "$APK" \
            | grep 'lib/arm64-v8a/libminecraftpe.so'

      # ==========================================================
      # APK SIGNATURE
      # ==========================================================

      - name: Verify APK signature
        run: |
          set -e

          apksigner verify \
            --verbose \
            "out/eclient-minecraft-1.21.111-arm64.apk"

      # ==========================================================
      # FINAL ARM64 CHECK
      # ==========================================================

      - name: Inspect final Minecraft library
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/final"

          unzip -p \
            "out/eclient-minecraft-1.21.111-arm64.apk" \
            'lib/arm64-v8a/libminecraftpe.so' \
            > "$RUNNER_TEMP/final/libminecraftpe.so"

          test -s "$RUNNER_TEMP/final/libminecraftpe.so"

          file "$RUNNER_TEMP/final/libminecraftpe.so"

          file "$RUNNER_TEMP/final/libminecraftpe.so" \
            | grep -qiE 'ARM aarch64|ARM64'

      # ==========================================================
      # UPLOAD APK
      # ==========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eclient-minecraft-1.21.111-arm64
          path: out/eclient-minecraft-1.21.111-arm64.apk
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # UPLOAD NATIVE BUILD
      # ==========================================================

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: eclient-native-1.21.111-arm64
          path: |
            build/native-android/**/*.so
            build/native-android/**/*.a
          if-no-files-found: warn
          retention-days: 14

      # ==========================================================
      # SUMMARY
      # ==========================================================

      - name: Summary
        if: always()
        run: |
          echo
          echo "======================================"
          echo " E-CLIENT 1.21.111"
          echo "======================================"
          echo "ABI: arm64-v8a"
          echo "NDK: 28.2.13676358"
          echo "CMake: 3.22.1"
          echo
          echo "Minecraft SHA:"
          echo "69f6584c000a4ec80ff8c4790f43d80b3e2ee67788842fdd39fd5be70fdb3d59"
          echo
          echo "GNU Build ID check: DISABLED"
          echo "Reason: supplied libminecraftpe.so has no readable build-id note."
          echo
          echo "======================================"
