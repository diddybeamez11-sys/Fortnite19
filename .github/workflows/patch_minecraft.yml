name: Build E-Client 1.21.111 ARM64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the original Minecraft 1.21.111 ARM64 APK"
        required: true
        default: "mc-base"

      asset_name:
        description: "Minecraft APK asset name"
        required: true
        default: "minecraft-1-21-111.apk"

permissions:
  contents: read

concurrency:
  group: eclient-1.21.111-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build native runtime and patch APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ------------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show source tree
        run: |
          echo "=== Repository ==="
          pwd

          echo
          echo "=== Files ==="
          find . -maxdepth 4 -type f | sort

          echo
          echo "=== Native source ==="
          find native -type f | sort

      # ------------------------------------------------------------
      # JAVA
      #
      # This project has NO Gradle build.
      # Do NOT enable setup-java Gradle caching.
      # ------------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # ANDROID SDK / NDK
      # ------------------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          test -d "${ANDROID_SDK_ROOT}/cmake/3.22.1"

          adb version
          cmake --version

          "${ANDROID_SDK_ROOT}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

      # ------------------------------------------------------------
      # SOURCE VALIDATION
      # ------------------------------------------------------------

      - name: Validate E-Client source
        run: |
          set -e

          test -f native/CMakeLists.txt
          test -f native/runtime/CMakeLists.txt

          test -f native/runtime/src/main.cpp
          test -f native/runtime/src/modules/GameplayModules.cpp
          test -f native/runtime/src/modules/ModuleManager.cpp
          test -f native/runtime/src/profile/Offsets_1_21_111.h
          test -f native/runtime/src/profile/PatchManager.cpp

          test -f native/vendor/dobby/libdobby.a

          test -f tools/build-and-patch.sh
          test -f tools/patch-minecraft-apk.sh
          test -f tools/verify-1.21.111.sh
          test -f tools/minecraft-host-loader.smali

          chmod +x tools/*.sh

          echo
          echo "=== 1.21.111 offsets ==="
          grep -E \
            'SetSprinting|InitMaxAutoStep|Gravity|Attack|NormalTick|GetRuntimeActor|GetHealth' \
            native/runtime/src/profile/Offsets_1_21_111.h

      # ------------------------------------------------------------
      # DOWNLOAD ORIGINAL MINECRAFT APK
      # ------------------------------------------------------------

      - name: Download Minecraft 1.21.111 APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/minecraft"

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir "$RUNNER_TEMP/minecraft"

          test -f "$RUNNER_TEMP/minecraft/$ASSET"

          echo
          echo "=== Downloaded APK ==="
          ls -lh "$RUNNER_TEMP/minecraft/$ASSET"

          echo
          echo "=== APK SHA-256 ==="
          sha256sum "$RUNNER_TEMP/minecraft/$ASSET"

      # ------------------------------------------------------------
      # VERIFY ORIGINAL MINECRAFT BINARY
      #
      # IMPORTANT:
      # verify-1.21.111.sh checks the ORIGINAL SHA:
      #
      # 69f6584c000a4ec80ff8c4790f43d80b3e2ee67788842fdd39fd5be70fdb3d59
      #
      # Therefore this MUST happen before patching.
      # ------------------------------------------------------------

      - name: Verify original Minecraft 1.21.111 binary
        run: |
          set -e

          tools/verify-1.21.111.sh \
            "$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}"

      # ------------------------------------------------------------
      # APKTOOL
      # ------------------------------------------------------------

      - name: Install apktool
        run: |
          set -e

          curl -fsSL \
            -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

          sudo mv /tmp/apktool.jar /usr/local/lib/apktool.jar

          cat <<'EOF' | sudo tee /usr/local/bin/apktool >/dev/null
          #!/bin/sh
          exec java -jar /usr/local/lib/apktool.jar "$@"
          EOF

          sudo chmod +x /usr/local/bin/apktool

          apktool --version

      # ------------------------------------------------------------
      # CMAKE CONFIGURATION
      # ------------------------------------------------------------

      - name: Configure native ARM64 build
        run: |
          set -e

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"

          rm -rf build

          cmake \
            -S native \
            -B build/native-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Build native runtime
        run: |
          set -e

          cmake \
            --build build/native-android \
            --parallel 2 \
            --verbose

      # ------------------------------------------------------------
      # CHECK BUILD OUTPUT
      # ------------------------------------------------------------

      - name: Verify native libraries
        run: |
          set -e

          echo "=== Native libraries ==="
          find build/native-android \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

          HOST_SO="build/native-android/runtime/libeclient_host.so"

          test -f "$HOST_SO"

          echo
          echo "=== Host library ==="
          file "$HOST_SO"

          file "$HOST_SO" | grep -Ei \
            'ARM aarch64|ARM64'

          echo
          echo "=== Runtime library ==="

          RUNTIME_SO="build/native-android/runtime/libeclient_runtime.so"

          if [ -f "$RUNTIME_SO" ]; then
            file "$RUNTIME_SO"
            file "$RUNTIME_SO" | grep -Ei \
              'ARM aarch64|ARM64'
          fi

      # ------------------------------------------------------------
      # PATCH
      # ------------------------------------------------------------

      - name: Build and patch Minecraft APK
        run: |
          set -e

          mkdir -p out

          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"

          tools/build-and-patch.sh \
            "$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}" \
            "$PWD/out/eclient-minecraft-1.21.111-arm64.apk"

      # ------------------------------------------------------------
      # VERIFY PATCHED APK
      # ------------------------------------------------------------

      - name: Verify patched APK
        run: |
          set -e

          APK="out/eclient-minecraft-1.21.111-arm64.apk"

          test -f "$APK"

          echo "=== Patched APK ==="
          ls -lh "$APK"

          echo
          echo "=== Patched APK SHA-256 ==="
          sha256sum "$APK"

          echo
          echo "=== ARM64 libraries ==="
          unzip -l "$APK" | grep 'lib/arm64-v8a/'

          unzip -l "$APK" | grep \
            'lib/arm64-v8a/libminecraftpe.so'

          unzip -l "$APK" | grep \
            'lib/arm64-v8a/libeclient_host.so'

      # ------------------------------------------------------------
      # APK SIGNATURE
      # ------------------------------------------------------------

      - name: Verify APK signature
        run: |
          set -e

          apksigner verify \
            --verbose \
            out/eclient-minecraft-1.21.111-arm64.apk

      # ------------------------------------------------------------
      # EXTRACT AND VERIFY INJECTED LIBRARY
      # ------------------------------------------------------------

      - name: Verify injected host library
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/final"

          unzip -p \
            out/eclient-minecraft-1.21.111-arm64.apk \
            lib/arm64-v8a/libeclient_host.so \
            > "$RUNNER_TEMP/final/libeclient_host.so"

          test -s "$RUNNER_TEMP/final/libeclient_host.so"

          file "$RUNNER_TEMP/final/libeclient_host.so"

          file "$RUNNER_TEMP/final/libeclient_host.so" | grep -Ei \
            'ARM aarch64|ARM64'

      # ------------------------------------------------------------
      # ARTIFACTS
      # ------------------------------------------------------------

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: eclient-minecraft-1.21.111-arm64
          path: out/eclient-minecraft-1.21.111-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: eclient-native-1.21.111-arm64
          path: |
            build/native-android/**/*.so
            build/native-android/**/*.a
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------
      # BUILD SUMMARY
      # ------------------------------------------------------------

      - name: Build summary
        if: always()
        run: |
          echo "========================================"
          echo " E-CLIENT 1.21.111 ARM64 BUILD"
          echo "========================================"
          echo
          echo "Source: CMake/NDK"
          echo "ABI: arm64-v8a"
          echo "NDK: 28.2.13676358"
          echo "CMake: 3.22.1"
          echo "Minecraft: 1.21.111"
          echo "Expected GNU Build ID:"
          echo "ea5614dcc3551721b14f9b4686aa1651c1b8f79e"
          echo
          echo "Expected original APK SHA:"
          echo "69f6584c000a4ec80ff8c4790f43d80b3e2ee67788842fdd39fd5be70fdb3d59"
          echo
          echo "========================================"
