name: Build E-Client 1.21.111 ARM64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag containing the Minecraft 1.21.111 ARM64 APK"
        required: true
        default: "mc-base"
      asset_name:
        description: "Minecraft APK asset name"
        required: true
        default: "minecraft-1-21-111.apk"

permissions:
  contents: read

concurrency:
  group: eclient-1.21.111-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          adb version
          aapt2 version
          "${ANDROID_SDK_ROOT}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          cmake --version

      - name: Install apktool
        run: |
          sudo curl -fsSL \
            -o /usr/local/lib/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

          printf '%s\n' \
            '#!/bin/sh' \
            'exec java -jar /usr/local/lib/apktool.jar "$@"' \
            | sudo tee /usr/local/bin/apktool >/dev/null

          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Download Minecraft APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/minecraft"

          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "$ASSET" \
            --dir "$RUNNER_TEMP/minecraft"

          test -f "$RUNNER_TEMP/minecraft/$ASSET"

          sha256sum "$RUNNER_TEMP/minecraft/$ASSET"

      - name: Verify source tree
        run: |
          test -f native/runtime/CMakeLists.txt
          test -f native/runtime/src/main.cpp
          test -f tools/build-and-patch.sh
          test -f tools/patch-minecraft-apk.sh
          test -f tools/verify-1.21.111.sh

          chmod +x tools/*.sh

      - name: Configure native build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          cmake \
            -S native \
            -B build/android-arm64 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      - name: Build native runtime
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          cmake --build build/android-arm64 --parallel 2

      - name: Verify native output
        run: |
          find build/android-arm64 -type f \
            \( -name "*.so" -o -name "*.a" \) -print

          SO="$(find build/android-arm64 -type f -name "*.so" | head -n 1)"

          if [ -z "$SO" ]; then
            echo "ERROR: No native .so was produced."
            exit 1
          fi

          file "$SO"

          if ! file "$SO" | grep -qiE 'ARM aarch64|ARM64'; then
            echo "ERROR: Native library is not ARM64."
            exit 1
          fi

      - name: Build and patch APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          mkdir -p out

          tools/build-and-patch.sh \
            "$RUNNER_TEMP/minecraft/${{ inputs.asset_name }}" \
            "$PWD/out/eclient-minecraft-1.21.111-arm64.apk"

      - name: Verify final APK
        run: |
          APK="out/eclient-minecraft-1.21.111-arm64.apk"

          test -f "$APK"

          echo "=== SHA-256 ==="
          sha256sum "$APK"

          echo "=== APK contents ==="
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/|AndroidManifest.xml' | head -100

          echo "=== APK architecture ==="
          unzip -l "$APK" | grep 'lib/arm64-v8a/' || {
            echo "ERROR: APK does not contain arm64-v8a native libraries."
            exit 1
          }

      - name: Verify APK signature
        run: |
          apksigner verify --verbose out/eclient-minecraft-1.21.111-arm64.apk

      - name: Verify Minecraft 1.21.111 binary
        run: |
          chmod +x tools/verify-1.21.111.sh
          tools/verify-1.21.111.sh \
            out/eclient-minecraft-1.21.111-arm64.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: eclient-minecraft-1.21.111-arm64
          path: out/eclient-minecraft-1.21.111-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: eclient-native-arm64-build
          path: |
            build/android-arm64/**/*.so
            build/android-arm64/**/*.a
          if-no-files-found: warn
          retention-days: 7
